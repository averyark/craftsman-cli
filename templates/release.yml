# Copy to .github/workflows/release.yml.
#
# Started by `craftsman publish --apply`, never by a push. Builds each
# places/<role>.place.json and hands it to Project Control, which decides where
# it may deploy. Holds no Roblox key and cannot publish a place.
#
# Needs only this repository named in the console under Settings -> Releases.
# No secret: the run signs in with GitHub's OIDC token. The repository variable
# CONTROL_RELEASE_ENDPOINT points it at a console other than the hosted one.
#
# Three jobs, so the OIDC token can never be minted by code from Rokit, Wally,
# Ember or your own scripts -- any step in a job granted `id-token: write` can
# mint it:
#
#   prepare   id-token. curl and jq only: lists commits and changelogs,
#             downloads the Craftsman bundle craftsman.lock names, and
#             downloads each "source": "control" place's Studio place.
#   build     no id-token. Installs the tools and builds on those files.
#   handover  id-token. curl and jq only: checks both artifacts against the
#             SHA-256 the other jobs reported, then hands the candidates over.
#
# Keep it that way when you edit this file: never install or run a tool in
# `prepare` or `handover`.

name: Release candidate

on:
  workflow_dispatch:
    inputs:
      places:
        description: Set by a publish.
        required: false
        type: string
      targets:
        description: Set by a publish.
        required: false
        type: string
      from:
        description: Set by a publish.
        required: false
        type: string
      place_id:
        description: Set by Project Control.
        required: false
        type: string
      commit:
        description: Set by Project Control.
        required: false
        type: string
      rebuild_of:
        description: Set by Project Control.
        required: false
        type: string
      baseline_id:
        description: Set by Project Control.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.places || inputs.place_id || 'all' }}-${{ inputs.rebuild_of || 'new' }}
  cancel-in-progress: true

jobs:
  # git, jq and curl only: this job can mint the OIDC token.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      inputs: ${{ steps.seal.outputs.inputs }}
      artifact: ${{ steps.seal.outputs.artifact }}

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Collect commits and changelogs
        env:
          FROM: ${{ inputs.from }}
          REBUILD_OF: ${{ inputs.rebuild_of }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs"
          out="$RUNNER_TEMP/inputs/changelog.json"
          commits="$RUNNER_TEMP/inputs/commits.json"
          echo null > "$out"
          echo null > "$commits"

          if [ -n "$REBUILD_OF" ]; then
            echo "::notice::A rebuild keeps the commits and changelog of the release it replaces."
            exit 0
          fi
          if [ -z "$FROM" ]; then
            echo "::notice::Nothing deployed yet, so there are no earlier commits to list."
            exit 0
          fi
          if ! [[ "$FROM" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            echo "::warning::The last deployed commit ($FROM) is not in this history."
            exit 0
          fi

          total="$(git rev-list --count "$FROM..HEAD")"
          truncated=$(( total > 200 ? total - 200 : 0 ))
          git log -n 200 --format='%H%x09%cI%x09%an%x09%s' "$FROM..HEAD" |
            jq -R -s --arg from "$FROM" --argjson truncated "$truncated" '
              {
                commits: (split("\n") | map(select(length > 0) | split("\t") |
                  {sha: .[0], committed_at: .[1], author: .[2], subject: (.[3:] | join(" "))})),
                commits_from: $from,
                commits_truncated: $truncated
              }' > "$commits"

          # Changelogs are changelogs/<yyyy-mm-dd>-<topic>/CHANGELOG.md, sent only
          # when this range added them.
          if ! added="$(git diff --name-only --diff-filter=A "$FROM" HEAD -- 'changelogs/*/CHANGELOG.md')"; then
            echo "::warning::Could not compare $FROM with HEAD."
            exit 0
          fi
          files=()
          [ -n "$added" ] && mapfile -t files < <(sort <<<"$added")

          # Never read a symbolic link, or a path whose real location leaves the
          # checkout: a committed link could point at /proc/self/environ.
          root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          in_repository() {
            local real
            [ -f "$1" ] && [ ! -L "$1" ] || return 1
            real="$(realpath -e -- "$1")" || return 1
            [[ "$real" == "$root"/* ]]
          }

          entries='[]'
          for file in "${files[@]}"; do
            name="$(basename "$(dirname "$file")")"
            if [ ${#name} -gt 80 ] || ! [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::warning file=$file::Skipped: name the folder <yyyy-mm-dd>-<topic>, lowercase, at most 80 characters."
              continue
            fi
            if ! in_repository "$file"; then
              echo "::warning file=$file::Skipped: a changelog must be a regular file inside the repository, never a symbolic link."
              continue
            fi
            if [ "$(wc -c < "$file")" -gt 65536 ]; then
              echo "::warning file=$file::Skipped: over 64 KB."
              continue
            fi
            if ! grep -q '[^[:space:]]' "$file"; then
              echo "::warning file=$file::Skipped: empty."
              continue
            fi
            if [ "$(jq length <<<"$entries")" -ge 20 ]; then
              echo "::warning::Over 20 changelogs; the rest were not sent."
              break
            fi
            entries="$(jq -c --arg name "$name" --rawfile markdown "$file" '. + [{name: $name, markdown: $markdown}]' <<<"$entries")"
          done
          printf '%s' "$entries" > "$out"

          {
            echo "## Commits since the last deploy"
            echo
            if [ "$(jq '.commits | length' "$commits")" -eq 0 ]; then
              echo "_None._"
            else
              jq -r '.commits[] | "- `\(.sha[0:7])` \(.subject) (\(.author))"' "$commits"
              if [ "$truncated" -gt 0 ]; then echo "- _and $truncated more._"; fi
            fi
            echo
            echo "## Changelog"
            echo
            if [ "$(jq length <<<"$entries")" -eq 0 ]; then
              echo "_None._"
            else
              jq -r '.[] | "### \(.name)\n\n\(.markdown)\n"' <<<"$entries"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Craftsman comes from Project Control's registry, here, so the
      # download link never leaves this job or reaches the log. Build installs
      # it from the sealed inputs and asks nothing. The last deployed commit's
      # bundle comes too when its craftsman.lock names another one.
      - name: Fetch Craftsman
        env:
          FROM: ${{ inputs.from }}
          REBUILD_OF: ${{ inputs.rebuild_of }}
          ENDPOINT: ${{ vars.CONTROL_RELEASE_ENDPOINT || 'https://operations.craftsman.systems/api/release-ingest' }}
          AUDIENCE: ${{ vars.CONTROL_RELEASE_AUDIENCE || 'https://operations.craftsman.systems' }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/inputs"
          answer="$RUNNER_TEMP/craftsman-fetch.json"
          mkdir -p "$inputs"

          # The registry sits beside release-ingest.
          registry="${ENDPOINT%/}"
          if [[ "$registry" != */release-ingest ]]; then
            echo "::error::CONTROL_RELEASE_ENDPOINT must end in /release-ingest, so that craftsman-bundle beside it can be found."
            exit 1
          fi
          registry="${registry%/release-ingest}/craftsman-bundle"

          oidc() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value
          }

          # A commit's craftsman.lock, only as a regular file.
          has_lock() {
            local entry
            entry="$(git ls-tree "$1" -- craftsman.lock)"
            [[ "$entry" == "100644 blob "* || "$entry" == "100755 blob "* ]]
          }

          # Sets lock_version, lock_sha256, lock_tree and lock_shippable from
          # the lock's text, or sets problem and fails. Each key once, as
          # craftsman install writes it.
          read_lock() {
            local text key line value
            local -a found
            local pattern='^[[:space:]]*[a-z0-9]+[[:space:]]*=[[:space:]]*("([^"]*)"|([a-z]+))[[:space:]]*(#.*)?$'
            text="$(tr -d '\r' <<<"$1")"
            for key in version sha256 tree shippable; do
              mapfile -t found < <(grep -E "^[[:space:]]*$key[[:space:]]*=" <<<"$text" || true)
              if [ ${#found[@]} -eq 0 ]; then
                problem="it has no $key"
                return 1
              fi
              if [ ${#found[@]} -gt 1 ]; then
                problem="it names $key more than once"
                return 1
              fi
              line="${found[0]}"
              if ! [[ "$line" =~ $pattern ]]; then
                problem="its $key is not a quoted string, true or false"
                return 1
              fi
              value="${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
              printf -v "lock_$key" '%s' "$value"
            done
            if ! [[ "$lock_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              problem="its version, \"$lock_version\", is not MAJOR.MINOR.PATCH"
              return 1
            fi
            if ! [[ "$lock_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              problem="its sha256 is not a SHA-256 in lower-case hex"
              return 1
            fi
            if ! [[ "$lock_tree" =~ ^[0-9a-f]{64}$ ]]; then
              problem="its tree is not a SHA-256 in lower-case hex"
              return 1
            fi
            if [ "$lock_shippable" != "true" ] && [ "$lock_shippable" != "false" ]; then
              problem="its shippable is not true or false"
              return 1
            fi
          }

          # Fetches the bundle read_lock last read into $1, as bundle.zip and
          # bundle.json, and checks both against the lock. The download link
          # is masked, never printed, and gone from disk before it is used.
          fetch_bundle() {
            local dir="$1" status url token sha tree
            rm -rf "$dir"
            mkdir -p "$dir" || return 1
            status="$(jq -n --arg v "$lock_version" '{version: $v}' |
              curl -sS -o "$answer" -w '%{http_code}' -X POST "$registry/fetch" \
                -H "Authorization: Bearer $(oidc)" -H "Content-Type: application/json" --data-binary @-)" || true
            if [ "$status" != "200" ]; then
              problem="Project Control answered $status: $(jq -r '.message // .' "$answer" 2>/dev/null || echo "nothing it could read")"
              rm -f "$answer"
              return 1
            fi
            url="$(jq -r '.data.url // empty' "$answer")"
            if [ -n "$url" ]; then
              echo "::add-mask::$url"
              if [[ "$url" == *token=* ]]; then
                token="${url#*token=}"
                echo "::add-mask::${token%%&*}"
              fi
            fi
            if [ "$(jq -r '.data.version' "$answer")" != "$lock_version" ] \
                || [ "$(jq -r '.data.sha256' "$answer")" != "$lock_sha256" ] \
                || [ "$(jq -r '.data.tree' "$answer")" != "$lock_tree" ]; then
              problem="the registry's Craftsman $lock_version is $(jq -r '.data.sha256' "$answer"), and craftsman.lock names $lock_sha256. A published version never changes, so the lock names a build the registry never held"
              rm -f "$answer"
              return 1
            fi
            if ! jq -e -j '.data.bundle_json | strings' "$answer" > "$dir/bundle.json" || [ -z "$url" ]; then
              problem="Project Control's answer held no bundle.json or no download link"
              rm -f "$answer"
              return 1
            fi
            rm -f "$answer"
            if ! curl -sSf -o "$dir/bundle.zip" "$url"; then
              problem="bundle.zip could not be downloaded; its link lives 60 seconds, so run it again"
              return 1
            fi
            sha="$(sha256sum -- "$dir/bundle.zip" | cut -d' ' -f1)"
            tree="$(sha256sum -- "$dir/bundle.json" | cut -d' ' -f1)"
            if [ "$sha" != "$lock_sha256" ]; then
              problem="bundle.zip's SHA-256 is $sha, and craftsman.lock names $lock_sha256"
              return 1
            fi
            if [ "$tree" != "$lock_tree" ]; then
              problem="bundle.json's SHA-256 is $tree, and craftsman.lock's tree is $lock_tree"
              return 1
            fi
          }

          if ! has_lock HEAD; then
            echo "::error file=craftsman.lock::This commit has no craftsman.lock, so it still takes Craftsman from Wally. Run \`craftsman update\` to move it onto the Craftsman bundle, then commit craftsman.toml and craftsman.lock."
            exit 1
          fi
          if ! read_lock "$(git show HEAD:craftsman.lock)"; then
            echo "::error file=craftsman.lock::craftsman.lock cannot be read: $problem. Run \`craftsman install\` and commit what it writes."
            exit 1
          fi
          if [ "$lock_shippable" != "true" ]; then
            echo "::error file=craftsman.lock::craftsman.lock names a development bundle, $lock_version (shippable = false), which is never released. Run \`craftsman update\` to move to a published one, and commit craftsman.lock."
            exit 1
          fi
          if ! fetch_bundle "$inputs/bundle"; then
            echo "::error file=craftsman.lock::Craftsman $lock_version was not fetched: $problem."
            exit 1
          fi
          echo "::notice::Craftsman $lock_version (${lock_sha256:0:12}) fetched from Project Control's registry."
          head_lock="$lock_version $lock_sha256 $lock_tree $lock_shippable"

          if [ -z "$REBUILD_OF" ] && [[ "$FROM" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            if ! has_lock "$FROM"; then
              echo "::notice::The last deployed commit has no craftsman.lock, so it is built with Wally, as it was then."
            elif ! read_lock "$(git show "$FROM:craftsman.lock")"; then
              echo "::warning::The last deployed commit's craftsman.lock cannot be read ($problem), so save data will not be compared."
            elif [ "$lock_version $lock_sha256 $lock_tree $lock_shippable" = "$head_lock" ]; then
              echo "::notice::The last deployed commit names the same Craftsman, $lock_version."
            elif [ "$lock_shippable" != "true" ]; then
              echo "::warning::The last deployed commit names a development bundle, $lock_version, so save data will not be compared."
            elif ! fetch_bundle "$inputs/base-bundle"; then
              rm -rf "$inputs/base-bundle"
              echo "::warning::The last deployed commit's Craftsman $lock_version was not fetched ($problem), so save data will not be compared."
            else
              echo "::notice::The last deployed commit's Craftsman $lock_version fetched too."
            fi
          fi

      # "source": "control": download the Studio place Project Control holds,
      # here, so its signed URL never leaves this job or reaches the log.
      - name: Fetch Studio places
        id: plan
        env:
          ONLY_PLACE: ${{ inputs.place_id }}
          PLACES: ${{ inputs.places }}
          BASELINE_ID: ${{ inputs.baseline_id }}
          ENDPOINT: ${{ vars.CONTROL_RELEASE_ENDPOINT || 'https://operations.craftsman.systems/api/release-ingest' }}
          AUDIENCE: ${{ vars.CONTROL_RELEASE_AUDIENCE || 'https://operations.craftsman.systems' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          inputs="$RUNNER_TEMP/inputs"
          answer="$RUNNER_TEMP/baseline.json"
          mkdir -p "$inputs/baselines"

          oidc() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value
          }

          plan='[]'
          places=(places/*.place.json)
          if [ ${#places[@]} -eq 0 ]; then
            echo "::notice::No places/*.place.json, so nothing to build."
          fi

          # Never read a symbolic link, or a path whose real location leaves the
          # checkout: a committed link could point at /proc/self/environ.
          root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          in_repository() {
            local real
            [ -f "$1" ] && [ ! -L "$1" ] || return 1
            real="$(realpath -e -- "$1")" || return 1
            [[ "$real" == "$root"/* ]]
          }

          for place in "${places[@]}"; do
            name="$(basename "$place" .place.json)"
            if ! in_repository "$place"; then
              echo "::error file=$place::A place declaration must be a regular file inside the repository, never a symbolic link."
              exit 1
            fi
            place_id="$(jq -r '.placeId' "$place")"
            if [ -n "$ONLY_PLACE" ] && [ "$place_id" != "$ONLY_PLACE" ]; then
              continue
            fi
            if [ -n "$PLACES" ] && [[ ",$PLACES," != *",$place_id,"* ]]; then
              continue
            fi
            if ! [[ "$name" =~ ^[a-z][a-z0-9-]{0,31}$ ]]; then
              echo "::error file=$place::The role \"$name\" must be up to 32 lowercase letters, digits and hyphens, starting with a letter."
              exit 1
            fi
            universe_id="$(jq -r '.universeId' "$place")"
            entry="$(jq -n -c --arg name "$name" --arg place "$place" --arg p "$place_id" --arg u "$universe_id" \
              '{name: $name, place: $place, place_id: $p, universe_id: $u}')"

            if [ "$(jq -r '.source' "$place")" = "control" ]; then
              request='{}'
              if [ -n "$ONLY_PLACE" ] && [ -n "$BASELINE_ID" ]; then
                request="$(jq -n --arg b "$BASELINE_ID" '{baseline_id: $b}')"
              fi
              status="$(jq -n --argjson u "$universe_id" --argjson p "$place_id" --argjson r "$request" '{universe_id: $u, place_id: $p} + $r' |
                curl -sS -o "$answer" -w '%{http_code}' -X POST "$ENDPOINT/baseline" \
                  -H "Authorization: Bearer $(oidc)" -H "Content-Type: application/json" --data-binary @-)"

              # No Studio place available: the release waits in the console for
              # an upload, registered by handover. Not a failed build.
              if [ "$status" = "409" ] && [ "$(jq -r '.reason // empty' "$answer")" = "studio_unavailable" ]; then
                entry="$(jq -c --arg problem "$(jq -r '.message' "$answer")" '. + {waiting: $problem}' <<<"$entry")"
                echo "::notice file=$place::$name has no Studio place to build on; it will wait for an upload."
                plan="$(jq -c --argjson e "$entry" '. + [$e]' <<<"$plan")"
                rm -f "$answer"
                continue
              fi

              if [ "$status" != "200" ]; then
                echo "::error file=$place::$name: Project Control answered $status: $(jq -r '.message // .' "$answer")"
                exit 1
              fi

              location="$(jq -r .data.location "$answer")"
              echo "::add-mask::$location"
              curl -sSf --compressed -o "$inputs/baselines/$name.rbxl" "$location"
              entry="$(jq -c --arg b "baselines/$name.rbxl" '. + {baseline: $b}' <<<"$entry")"

              version="$(jq -r '.data.version // empty' "$answer")"
              if [ -n "$version" ]; then
                entry="$(jq -c --arg v "$version" '. + {baseline_version: $v}' <<<"$entry")"
              fi

              if [ "$(jq -r '.data.previous // empty' "$answer")" != "" ]; then
                previous_location="$(jq -r .data.previous.location "$answer")"
                echo "::add-mask::$previous_location"
                if curl -sSf --compressed -o "$inputs/baselines/$name.previous.rbxl" "$previous_location"; then
                  entry="$(jq -c --arg b "baselines/$name.previous.rbxl" '. + {previous: $b}' <<<"$entry")"
                else
                  rm -f "$inputs/baselines/$name.previous.rbxl"
                fi
              fi
              rm -f "$answer"
            fi

            plan="$(jq -c --argjson e "$entry" '. + [$e]' <<<"$plan")"
          done

          if [ -n "$ONLY_PLACE" ] && [ "$(jq length <<<"$plan")" -eq 0 ]; then
            echo "::error::No places/*.place.json declares place $ONLY_PLACE."
            exit 1
          fi
          if [ -n "$PLACES" ] && [ "$(jq length <<<"$plan")" -eq 0 ]; then
            echo "::error::No places/*.place.json declares any of $PLACES."
            exit 1
          fi

          echo "plan=$plan" >> "$GITHUB_OUTPUT"

      # SHA-256 of every file handed on, as a job output that later jobs cannot change.
      - name: Seal the inputs
        id: seal
        run: |
          set -euo pipefail
          digest() {
            (cd "$1" && find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r file; do
              printf '%s\t%s\n' "$file" "$(sha256sum -- "$file" | cut -d' ' -f1)"
            done) | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add // {}'
          }
          echo "inputs=$(digest "$RUNNER_TEMP/inputs")" >> "$GITHUB_OUTPUT"
          echo "artifact=release-inputs-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Keep the inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.seal.outputs.artifact }}
          path: ${{ runner.temp }}/inputs/
          if-no-files-found: error
          retention-days: 1

  # No id-token: this job runs Rokit's tools, Wally and Ember packages, and
  # your own scripts.
  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      candidates: ${{ steps.record.outputs.candidates }}
      artifact: ${{ steps.record.outputs.artifact }}

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          lfs: true

      - name: Fetch the inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/inputs

      - name: Check the inputs
        env:
          EXPECTED: ${{ needs.prepare.outputs.inputs }}
        run: |
          set -euo pipefail
          digest() {
            (cd "$1" && find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r file; do
              printf '%s\t%s\n' "$file" "$(sha256sum -- "$file" | cut -d' ' -f1)"
            done) | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add // {}'
          }
          if [ "$(digest "$RUNNER_TEMP/inputs" | jq -S -c .)" != "$(jq -S -c . <<<"$EXPECTED")" ]; then
            echo "::error::The inputs downloaded are not the ones Prepare fetched."
            exit 1
          fi

      # rokit.toml must list craftsman and rojo, and wally too for a project
      # with a wally.toml.
      - name: Install pinned tools
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The bundle Prepare fetched and sealed: nothing is downloaded here, and
      # the CLI checks it against craftsman.lock again.
      - name: Install Craftsman
        run: craftsman install --frozen --from "$RUNNER_TEMP/inputs/bundle"

      # Only for a game that takes packages of its own from Wally.
      - name: Resolve Wally packages
        if: hashFiles('wally.toml') != ''
        run: wally install

      # Only for a project that also uses Ember (e.g. Craftsman Kit). Pinned by
      # version and checked against the release asset's SHA-256 before it runs;
      # change both together.
      - name: Resolve Ember packages
        if: hashFiles('ember.toml') != ''
        env:
          EMBR_VERSION: v0.6.0
          EMBR_SHA256: 60f86f7f61e3a6992cf4ad2ee883c1ff3face921308e262a18c87270e1002a16
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/embr.download" "https://github.com/ember-luau/ember/releases/download/$EMBR_VERSION/embr-linux-x86_64"
          echo "$EMBR_SHA256  $RUNNER_TEMP/embr.download" | sha256sum --check --strict -
          install -m 0755 "$RUNNER_TEMP/embr.download" "$RUNNER_TEMP/bin/embr"
          rm -f "$RUNNER_TEMP/embr.download"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/embr" install --locked

      - name: Build candidates
        env:
          PLAN: ${{ needs.prepare.outputs.plan }}
          COMMIT: ${{ inputs.commit || github.sha }}
          FROM: ${{ inputs.from }}
          REBUILD_OF: ${{ inputs.rebuild_of }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/inputs"

          mapfile -t entries < <(jq -c '.[] | select(.waiting == null)' <<<"$PLAN")
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::notice::No place has anything to build on in this run."
            exit 0
          fi

          # The last deployed commit, to compare save data against. Its tools
          # are installed without Rokit's trust prompt, which is why this runs
          # only here, in the job that cannot mint the OIDC token. A commit
          # with a craftsman.lock installs the bundle Prepare fetched for it,
          # or the head's when it names the same one; a commit from before
          # the move off Wally installs with Wally, as it did then.
          install_base() {
            rokit install --no-trust-check > /dev/null || return 1
            if [ -f craftsman.lock ]; then
              craftsman install --frozen --from "$1" > /dev/null || return 1
              if [ -f wally.toml ]; then
                wally install > /dev/null || return 1
              fi
            else
              wally install > /dev/null || return 1
            fi
            if [ -f ember.toml ]; then
              embr install --locked > /dev/null || return 1
            fi
          }

          if [ -z "$REBUILD_OF" ] && [[ "$FROM" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            git worktree add --detach base "$FROM" > /dev/null
            base_bundle="$inputs/bundle"
            if [ -d "$inputs/base-bundle" ]; then
              base_bundle="$inputs/base-bundle"
            fi
            if ! (cd base && install_base "$base_bundle"); then
              echo "::warning::Could not install the last deployed commit's tools, so save data was not compared."
              git worktree remove --force base
            fi
          fi

          for entry in "${entries[@]}"; do
            name="$(jq -r .name <<<"$entry")"
            place="$(jq -r .place <<<"$entry")"
            compare=()
            source_args=()

            baseline="$(jq -r '.baseline // empty' <<<"$entry")"
            if [ -n "$baseline" ]; then
              mkdir -p baselines
              cp "$inputs/$baseline" "baselines/$name.rbxl"
              source_args+=(--baseline "baselines/$name.rbxl")
              version="$(jq -r '.baseline_version // empty' <<<"$entry")"
              if [ -n "$version" ]; then
                source_args+=(--baseline-version "$version")
              fi
              previous="$(jq -r '.previous // empty' <<<"$entry")"
              if [ -n "$previous" ]; then
                cp "$inputs/$previous" "baselines/$name.previous.rbxl"
                compare+=(--previous "baselines/$name.previous.rbxl")
              fi
            fi

            if [ -f "base/$place" ]; then
              if (cd base && craftsman release "$place" --data-only --out ../dist-base); then
                compare+=(--previous-release "dist-base/$name.release.json")
              else
                echo "::warning::The last deployed commit's declaration for $name did not load, so save data was not compared."
              fi

              committed="$(jq -r '.baseline // empty' "base/$place")"
              if [ -n "$committed" ] && [ -f "base/$committed" ]; then
                compare+=(--previous "base/$committed")
              fi
            fi

            echo "::group::$name"
            craftsman release "$place" --commit "$COMMIT" "${source_args[@]}" "${compare[@]}"
            echo "::endgroup::"
          done

      - name: Summarise
        if: always()
        run: craftsman summary dist >> "$GITHUB_STEP_SUMMARY"

      - name: Record the candidates
        id: record
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.rbxl dist/*.release.json dist/*.manifest.json)
          for file in "${files[@]}"; do
            printf '%s\t%s\n' "${file#dist/}" "$(sha256sum -- "$file" | cut -d' ' -f1)"
          done | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add // {}' > "$RUNNER_TEMP/candidates.json"
          echo "candidates=$(cat "$RUNNER_TEMP/candidates.json")" >> "$GITHUB_OUTPUT"
          echo "artifact=release-candidate-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Keep the candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: |
            dist/*.rbxl
            dist/*.release.json
            dist/*.manifest.json
          if-no-files-found: ignore
          retention-days: 30

  # curl and jq only: this job can mint the OIDC token. Runs after a failed
  # build too, so a place waiting for a Studio place is still registered.
  handover:
    name: Hand over
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - name: Fetch the inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/inputs

      - name: Fetch the candidates
        if: needs.build.result == 'success' && needs.build.outputs.candidates != '{}'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/dist

      - name: Hand the candidates to Project Control
        working-directory: ${{ runner.temp }}
        env:
          PLAN: ${{ needs.prepare.outputs.plan }}
          INPUT_HASHES: ${{ needs.prepare.outputs.inputs }}
          BUILT: ${{ needs.build.result }}
          CANDIDATE_HASHES: ${{ needs.build.outputs.candidates }}
          COMMIT: ${{ inputs.commit || github.sha }}
          ONLY_PLACE: ${{ inputs.place_id }}
          REBUILD_OF: ${{ inputs.rebuild_of }}
          TARGETS: ${{ inputs.targets }}
          ENDPOINT: ${{ vars.CONTROL_RELEASE_ENDPOINT || 'https://operations.craftsman.systems/api/release-ingest' }}
          AUDIENCE: ${{ vars.CONTROL_RELEASE_AUDIENCE || 'https://operations.craftsman.systems' }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/inputs"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"

          digest() {
            (cd "$1" && find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r file; do
              printf '%s\t%s\n' "$file" "$(sha256sum -- "$file" | cut -d' ' -f1)"
            done) | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add // {}'
          }
          same() { [ "$(jq -S -c . <<<"$1")" = "$(jq -S -c . <<<"$2")" ]; }

          oidc() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value
          }

          post() {
            curl -sS -o response.json -w '%{http_code}' -X POST "$ENDPOINT/$1" \
              -H "Authorization: Bearer $(oidc)" -H "Content-Type: application/json" \
              --data-binary @-
          }

          recipients_of() {
            if [ -n "$TARGETS" ]; then
              jq -r --arg r "$1" '.[$r] // [] | .[] | tostring' <<<"$TARGETS"
            else
              printf '%s\n' "$2"
            fi
          }

          jq -e 'type == "array"' <<<"$PLAN" > /dev/null
          if ! same "$(digest "$inputs")" "$INPUT_HASHES"; then
            echo "::error::The inputs downloaded are not the ones Prepare fetched, so nothing was handed over."
            exit 1
          fi

          changelog="$inputs/changelog.json"
          commits="$inputs/commits.json"

          # Places with no Studio place to build on wait for an upload, on every
          # place that would have received the build.
          mapfile -t waiting < <(jq -c '.[] | select(.waiting != null)' <<<"$PLAN")
          for entry in "${waiting[@]}"; do
            name="$(jq -r .name <<<"$entry")"
            place_id="$(jq -r .place_id <<<"$entry")"
            universe_id="$(jq -r .universe_id <<<"$entry")"
            problem="$(jq -r .waiting <<<"$entry")"
            mapfile -t recipients < <(recipients_of "$name" "$place_id")
            for recipient in "${recipients[@]}"; do
              waited="$(jq -n --argjson u "$universe_id" --argjson p "$recipient" --argjson s "$place_id" --arg role "$name" \
                  --arg problem "$problem" --arg commit "$COMMIT" --arg rebuild "$REBUILD_OF" \
                  --slurpfile c "$changelog" --slurpfile k "$commits" \
                  '{universe_id: $u, place_id: $p, problem: $problem, commit: $commit, changelog: $c[0]}
                   + ($k[0] // {})
                   + (if $p == $s then {} else {source_place_id: $s, role: $role} end)
                   + (if $rebuild == "" then {} else {rebuild_of: $rebuild} end)' | post waiting)"
              if [ "$waited" = "200" ]; then
                echo "::warning::$name for place $recipient is waiting for a Studio place: $problem"
              elif [ "$waited" = "403" ]; then
                echo "::notice::$name for place $recipient was not handed over: $(jq -r .message response.json)"
              else
                echo "::error::$name for place $recipient: Project Control answered $waited: $(jq -r '.message // .' response.json)"
                exit 1
              fi
            done
          done

          mapfile -t built < <(jq -c '.[] | select(.waiting == null)' <<<"$PLAN")
          if [ ${#built[@]} -eq 0 ]; then
            exit 0
          fi
          if [ "$BUILT" != "success" ]; then
            echo "::notice::The build did not pass, so no candidate was handed over."
            exit 0
          fi
          if ! same "$(digest "$dist")" "$CANDIDATE_HASHES"; then
            echo "::error::The candidates downloaded are not the ones Build recorded, so nothing was handed over."
            exit 1
          fi

          for entry in "${built[@]}"; do
            name="$(jq -r .name <<<"$entry")"
            source_place="$(jq -r .place_id <<<"$entry")"
            universe_id="$(jq -r .universe_id <<<"$entry")"
            report="$dist/$name.release.json"
            artifact="$dist/$name.rbxl"
            if [ ! -f "$report" ] || [ ! -f "$artifact" ]; then
              echo "::error::Build passed but left no candidate for $name."
              exit 1
            fi

            # Only what Prepare planned, described by its own report, built on
            # the Studio place Prepare fetched.
            sha="$(sha256sum -- "$artifact" | cut -d' ' -f1)"
            baseline_sha=""
            baseline="$(jq -r '.baseline // empty' <<<"$entry")"
            if [ -n "$baseline" ]; then
              baseline_sha="$(jq -r --arg k "$baseline" '.[$k] // empty' <<<"$INPUT_HASHES")"
            fi
            wrong="$(jq -r --arg name "$name" --arg p "$source_place" --arg u "$universe_id" --arg commit "$COMMIT" \
                --arg sha "$sha" --arg bsha "$baseline_sha" '
              [ if .place.role != $name then "its role is not \($name)" else empty end,
                if (.place.placeId | tostring) != $p then "it is for another place" else empty end,
                if (.place.universeId | tostring) != $u then "it is for another universe" else empty end,
                if .inputs.commit != $commit then "it was built from another commit" else empty end,
                if ((.output.sha256 // "") | ascii_downcase) != $sha then "it describes another file" else empty end,
                if $bsha != "" and ((.inputs.baseline.sha256 // "") | ascii_downcase) != $bsha then "it was built on another Studio place" else empty end
              ] | join("; ")' "$report")"
            if [ -n "$wrong" ]; then
              echo "::error::$name was not handed over: $wrong."
              exit 1
            fi

            manifest="$dist/$name.manifest.json"
            if [ -f "$manifest" ]; then
              body="$(jq -n --slurpfile r "$report" --slurpfile m "$manifest" --slurpfile c "$changelog" '{report: $r[0], manifest: $m[0], changelog: $c[0]}')"
            else
              body="$(jq -n --slurpfile r "$report" --slurpfile c "$changelog" '{report: $r[0], changelog: $c[0]}')"
            fi
            body="$(jq --slurpfile k "$commits" '. + ($k[0] // {})' <<<"$body")"
            if [ -n "$REBUILD_OF" ] && [ "$source_place" = "$ONLY_PLACE" ]; then
              body="$(jq --arg id "$REBUILD_OF" '. + {rebuild_of: $id}' <<<"$body")"
            fi

            # Every place with this role gets the same file; a copy names the
            # place it was built on.
            mapfile -t recipients < <(recipients_of "$name" "$source_place")
            for recipient in "${recipients[@]}"; do
              if [ "$recipient" = "$source_place" ]; then
                sent="$body"
              else
                sent="$(jq --argjson p "$recipient" --argjson s "$source_place" \
                  '.report.place.placeId = $p | . + {source_place_id: $s} | del(.rebuild_of)' <<<"$body")"
              fi

              status="$(printf '%s' "$sent" | post start)"
              if [ "$status" = "403" ]; then
                echo "::notice::$name for place $recipient was not handed over: $(jq -r .message response.json)"
                continue
              fi
              if [ "$status" != "200" ]; then
                echo "::error::$name for place $recipient: Project Control answered $status: $(jq -r '.message // .' response.json)"
                exit 1
              fi

              release_id="$(jq -r .data.release_id response.json)"
              upload_url="$(jq -r .data.upload_url response.json)"
              group="$(jq -r .data.place_group response.json)"

              curl -sSf -X PUT "$upload_url" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$artifact" > /dev/null

              status="$(jq -n --arg id "$release_id" '{release_id: $id}' | post seal)"
              if [ "$status" != "200" ]; then
                echo "::error::$name for place $recipient: sealing failed: $(jq -r '.message // .' response.json)"
                exit 1
              fi

              echo "::notice::$name is a release candidate in $group, place $recipient ($release_id)."
            done
          done
